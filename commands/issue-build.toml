description = "Build from a GitHub Issue — resolve spec/plan/todo from the issue, then chain /build"

prompt = """
Invoke the incremental-implementation skill alongside test-driven-development.

The argument is the issue number (e.g. `/issue-build 42`). If no argument is provided, stop and ask the user for the issue number.

## Step 1: Fetch the issue

Run `gh issue view <n> --json title,body` to fetch the issue's title and body.

If `gh` is not on `PATH`, stop and tell the user — this command requires the GitHub CLI.

## Step 2: Resolve the spec/plan/todo from the issue

**Primary: parse the issue body for links.** Look for markdown links to:
- `/specs/<feature>/SPEC.md`
- `/specs/<feature>/tasks/plan.md`
- `/specs/<feature>/tasks/todo.md`

Extract `<feature>` from the first matching link.

**Fallback: derive from the issue title.** If the body contains no spec links, derive `<feature>` from the issue title. The title should be `[BUILD] <name>` — strip the `[BUILD] ` prefix and use the remaining `<name>` (already kebab-cased by `issue-create`) as `<feature>`. Look under `/specs/<name>/`.

If neither method resolves a spec, stop and tell the user — the issue does not reference a spec.

## Step 3: Chain the /build flow

With the resolved artefact paths, execute the complete `/build auto` flow rather than an abbreviated local copy. This includes plan approval, the canonical Spec-Driven Stack Setup from incremental-implementation, exact branch checkout on resume, declared trunks and `gh stack init --base`, parent checkout before `gh stack add`, task-status commits, cross-stack merge checkpoints, verification, and blocker handling.

If the plan is missing, generate and land it as `/build auto` requires before implementation. If a checkpoint is reached, report the completed stacks for `/issue-pr` and resume only after their prerequisites are merged into the next stack's declared trunk.

This command delegates to the `/build` workflow plus `incremental-implementation` and `test-driven-development`; it has no independent build loop of its own.
"""
